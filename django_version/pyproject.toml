[project]
name = "skillbridge"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
    "argon2-cffi==25.1.0",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
    "django-stubs==6.1.0",
]

[tool.pytest]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "-v", "--tb=short"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
files = ["accounts", "profiles", "config", "manage.py"]
exclude = "^(accounts|profiles)/tests/"

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ruff]

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["RUF012"]
"*/tests/*" = ["S101", "S106"]
