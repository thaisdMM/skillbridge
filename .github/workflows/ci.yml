name: CI

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: django_version

    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: skillbridge_ci
          POSTGRES_USER: skillbridge_user
          POSTGRES_PASSWORD: skillbridge_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DB_NAME: skillbridge_ci
      DB_USER: skillbridge_user
      DB_PASSWORD: skillbridge_pass
      DB_HOST: localhost
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
